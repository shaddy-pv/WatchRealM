<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" width="340" height="76" fill="none">
  <defs>
    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#eab308" />
      <stop offset="50%" stop-color="#fef9c3" />
      <stop offset="75%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="goldFillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181008" />
      <stop offset="50%" stop-color="#0a0603" />
      <stop offset="100%" stop-color="#140d06" />
    </linearGradient>
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fef08a" />
      <stop offset="75%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Filigree Wing -->
  <g fill="url(#goldBorderGrad)" stroke="#78350f" stroke-width="0.6">
    <path d="M 8 38 L 44 29 L 56 38 L 44 47 Z" />
    <path d="M 2 38 L 18 35 L 18 41 Z" />
    <path d="M 40 30 C 32 23 25 21 20 19 C 27 26 33 30 42 32 Z" />
    <path d="M 40 46 C 32 53 25 55 20 57 C 27 50 33 46 42 44 Z" />
    <polygon points="28,38 35,33 42,38 35,43" fill="#fef9c3" />
  </g>

  <!-- Right Filigree Wing -->
  <g fill="url(#goldBorderGrad)" stroke="#78350f" stroke-width="0.6">
    <path d="M 332 38 L 296 29 L 284 38 L 296 47 Z" />
    <path d="M 338 38 L 322 35 L 322 41 Z" />
    <path d="M 300 30 C 308 23 315 21 320 19 C 313 26 307 30 298 32 Z" />
    <path d="M 300 46 C 308 53 315 55 320 57 C 313 50 307 46 298 44 Z" />
    <polygon points="312,38 305,33 298,38 305,43" fill="#fef9c3" />
  </g>

  <!-- Top Center Crest -->
  <g fill="url(#goldBorderGrad)" stroke="#78350f" stroke-width="0.6">
    <path d="M 170 2 L 163 13 L 170 17 L 177 13 Z" />
    <path d="M 162 14 C 154 10 148 9 144 10 C 151 13 156 16 162 17 Z" />
    <path d="M 178 14 C 186 10 192 9 196 10 C 189 13 184 16 178 17 Z" />
    <polygon points="170,10 167,13 170,16 173,13" fill="#fef9c3" />
  </g>

  <!-- Bottom Center Crest -->
  <g fill="url(#goldBorderGrad)" stroke="#78350f" stroke-width="0.6">
    <path d="M 170 74 L 163 63 L 170 59 L 177 63 Z" />
    <path d="M 162 62 C 154 66 148 67 144 66 C 151 63 156 60 162 59 Z" />
    <path d="M 178 62 C 186 66 192 67 196 66 C 189 63 184 60 178 59 Z" />
    <polygon points="170,66 167,63 170,60 173,63" fill="#fef9c3" />
  </g>

  <!-- Main Capsule Body -->
  <rect x="52" y="16" width="236" height="44" rx="22" fill="url(#goldFillGrad)" stroke="url(#goldBorderGrad)" stroke-width="2" />

  <!-- Inner Fine Accent Inset -->
  <rect x="56" y="20" width="228" height="36" rx="18" fill="none" stroke="#d97706" stroke-width="1" opacity="0.8" />

  <!-- Side Inset Diamond Pips -->
  <circle cx="76" cy="38" r="1.8" fill="#fef08a" />
  <circle cx="264" cy="38" r="1.8" fill="#fef08a" />

  <!-- Center Text -->
  <text x="170" y="44" text-anchor="middle" dominant-baseline="middle" fill="url(#goldTextGrad)" font-family="Cinzel, Georgia, serif" font-size="15" font-weight="700" letter-spacing="4" filter="url(#goldGlow)">ENTER REALM</text>
</svg>
